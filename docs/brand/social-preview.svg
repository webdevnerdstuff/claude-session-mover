<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
	<title id="title">session-mover</title>
	<desc id="desc">Two workspace cards of session rows, one session moving from the first to the second, beside the words session-mover: move claude code sessions between workspaces in the Claude desktop app.</desc>
	<rect width="1280" height="640" fill="#0b0b0f"/>

	<!-- The mark, from the banner, at 1.3 times its size. -->
	<g transform="translate(72 172) scale(1.3)">
	<g transform="translate(0 0)">
		<rect x="0" y="20" width="104" height="176" rx="18" fill="#000000" stroke="#2a2a35" stroke-width="3"/>
		<line x1="0" y1="52" x2="104" y2="52" stroke="#2a2a35" stroke-width="3"/>
		<rect x="18" y="31" width="40" height="10" rx="5" fill="#2492ff"/>
		<circle cx="84" cy="36" r="5" fill="#7f817e"/>
		<circle cx="30" cy="77" r="6" fill="#0aff04"/>
		<rect x="44" y="72" width="46" height="10" rx="5" fill="#2a2a35"/>
		<rect x="14" y="98" width="80" height="22" rx="11" fill="none" stroke="#ff119066" stroke-width="2.5" stroke-dasharray="6 5"/>
		<circle cx="30" cy="141" r="6" fill="#ffb46a"/>
		<rect x="44" y="136" width="34" height="10" rx="5" fill="#2a2a35"/>
		<circle cx="30" cy="173" r="6" fill="#a5a8ff"/>
		<rect x="44" y="168" width="40" height="10" rx="5" fill="#2a2a35"/>
	</g>
	<g transform="translate(152 0)">
		<rect x="0" y="20" width="104" height="176" rx="18" fill="#000000" stroke="#2a2a35" stroke-width="3"/>
		<line x1="0" y1="52" x2="104" y2="52" stroke="#2a2a35" stroke-width="3"/>
		<rect x="18" y="31" width="40" height="10" rx="5" fill="#0aff04"/>
		<circle cx="84" cy="36" r="5" fill="#7f817e"/>
		<circle cx="30" cy="77" r="6" fill="#df00df"/>
		<rect x="44" y="72" width="38" height="10" rx="5" fill="#2a2a35"/>
		<circle cx="30" cy="109" r="6" fill="#2492ff"/>
		<rect x="44" y="104" width="46" height="10" rx="5" fill="#2a2a35"/>
		<rect x="14" y="130" width="80" height="22" rx="11" fill="#ff119026" stroke="#ff1190" stroke-width="2.5"/>
		<circle cx="30" cy="141" r="6" fill="#ff1190"/>
		<rect x="44" y="136" width="42" height="10" rx="5" fill="#ff1190"/>
	</g>
	<path d="M 98 109 C 128 109, 126 141, 150 141" fill="none" stroke="#ff1190" stroke-width="5" stroke-linecap="round"/>
	<path d="M 146 132 L 162 141 L 146 150 Z" fill="#ff1190" stroke="#ff1190" stroke-width="2" stroke-linejoin="round"/>
	</g>

	<!-- Wordmark and tagline, centred on the mark. -->
	<text x="446" y="318" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="96" font-weight="700" letter-spacing="-2">
		<tspan fill="#ffffff">session</tspan><tspan fill="#ff1190">-</tspan><tspan fill="#2492ff">mover</tspan>
	</text>
	<text x="450" y="378" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, sans-serif" font-size="32" fill="#9a9aa6">
		Move Claude Code sessions between workspaces
